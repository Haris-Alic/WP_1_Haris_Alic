<div class="trackers-container">
  <h1>My Daily Trackers</h1>
  <p class="subtitle">Prati svoje dnevne aktivnosti</p>

  <div class="trackers-grid">
    <div class="tracker-card" (click)="openTracker('sleep')">
      <div class="tracker-icon">😴</div>
      <h3>SLEEP TRACKER</h3>
    </div>

    <div class="tracker-card" (click)="openTracker('meal')">
      <div class="tracker-icon">🍽️</div>
      <h3>MEAL TRACKER</h3>
    </div>

    <div class="tracker-card" (click)="openTracker('habit')">
      <div class="tracker-icon">✅</div>
      <h3>HABIT TRACKER</h3>
    </div>

    <div class="tracker-card" (click)="openTracker('study')">
      <div class="tracker-icon">📚</div>
      <h3>STUDY PLANNER</h3>
    </div>

    <div class="tracker-card" (click)="openTracker('pixel')">
      <div class="tracker-icon">🎨</div>
      <h3>PIXEL TRACKER</h3>
    </div>

    <div class="tracker-card" (click)="openTracker('water')">
      <div class="tracker-icon">💧</div>
      <h3>WATER TRACKER</h3>
    </div>

    <div class="tracker-card" (click)="openTracker('calendar')">
      <div class="tracker-icon">📅</div>
      <h3>CALENDAR TRACKER</h3>
    </div>

    <div class="tracker-card" (click)="openTracker('task')">
      <div class="tracker-icon">📋</div>
      <h3>TASK/PROJECT PLANNER</h3>
    </div>
  </div>
</div>

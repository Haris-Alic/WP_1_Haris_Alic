<div class="sleep-tracker-container">
  <div class="header">
    <button class="btn-back" (click)="goBack()">← Nazad</button>
    <h1>😴 Sleep Tracker</h1>
  </div>

  <div class="tracker-content">
    <div class="sleep-section">
      <h2>Sati spavanja</h2>
      <div class="sleep-display">
        <div class="sleep-emoji">{{ getSleepQualityEmoji() }}</div>
        <div class="sleep-hours">{{ sleepData.hours }}</div>
        <div class="sleep-label">sati</div>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" [style.width.%]="getProgressPercentage()"></div>
      </div>

      <div class="stats">
        <div class="stat-card">
          <div class="stat-value">{{ sleepData.hours }}</div>
          <div class="stat-label">Danas</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">{{ sleepData.goal }}</div>
          <div class="stat-label">Cilj</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">{{ getProgressPercentage() | number:'1.0-0' }}%</div>
          <div class="stat-label">Napredak</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-add" (click)="incrementHours()">
        <span class="btn-icon">+</span>
        +0.5h
      </button>
      <button class="btn-remove" (click)="decrementHours()">
        <span class="btn-icon">−</span>
        -0.5h
      </button>
      <button class="btn-reset" (click)="resetToday()">
        🔄 Reset
      </button>
    </div>

    <div class="quality-section">
      <h3>Kvalitet sna</h3>
      <div class="quality-buttons">
        <button 
          class="quality-btn"
          [class.active]="sleepData.quality === 'excellent'"
          (click)="setQuality('excellent')"
        >
          😴🌟 Odličan
        </button>
        <button 
          class="quality-btn"
          [class.active]="sleepData.quality === 'good'"
          (click)="setQuality('good')"
        >
          😊 Dobar
        </button>
        <button 
          class="quality-btn"
          [class.active]="sleepData.quality === 'fair'"
          (click)="setQuality('fair')"
        >
          😐 Osrednji
        </button>
        <button 
          class="quality-btn"
          [class.active]="sleepData.quality === 'poor'"
          (click)="setQuality('poor')"
        >
          😫 Loš
        </button>
      </div>
    </div>

    <div class="message" *ngIf="sleepData.hours >= sleepData.goal">
      <div class="success-message">
        🎉 Odlično! Ispunili ste cilj od {{ sleepData.goal }} sati!
      </div>
    </div>
  </div>
</div>

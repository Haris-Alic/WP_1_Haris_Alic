<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vision Board</title>
    <link rel="stylesheet" href="visionboard.css" type="text/css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>
<body>
    <h1>Vision Board</h1>

    <div class="toolbar">
        <button id="add-note">Post It</button>
        <button id="add-quote">Citat</button>
        <button id="add-image">Slika</button>
        <button id="save-board">Snimi</button>
        <button id="clear-board">Ocisti ploču</button>
        <button id="savePdfBtn">Snimi kao PDF</button>
        <button id="emailBtn">Pošalji mailom</button>
    </div>

    <div id="board"></div>

    <div id="emailModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>Pošalji mailom</h3>
            <input type="email" id="emailInput" placeholder="Unesite email adresu..." />
            <div class="modal-buttons">
                <button id="sendEmailBtn">Pošalji</button>
                <button id="cancelEmailBtn">Poništi</button>
            </div>
        </div>
    </div>

    <footer>Web programiranje 2025 &copy; Internacionalna poslovno-informaciona akademija Tuzla</footer>


    <script src="visionboard.js"></script>
</body>
</html>
